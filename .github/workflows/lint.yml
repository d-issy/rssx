name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'src/rssx/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/lint.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.github/workflows/lint.yml'
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'flake.nix'
              - 'flake.lock'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: oxlint
        run: pnpm exec oxlint

      - name: tsc --noEmit
        run: pnpm typecheck

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-actionlint-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-actionlint-${{ runner.os }}-
      - run: nix run nixpkgs#actionlint

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-zizmor-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-zizmor-${{ runner.os }}-
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run nixpkgs#zizmor -- .

  all-lint-passed:
    needs: [changes, backend, frontend, actionlint, zizmor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all lint jobs succeeded or were skipped
        run: |
          fail=0
          for r in \
            "changes:${{ needs.changes.result }}" \
            "backend:${{ needs.backend.result }}" \
            "frontend:${{ needs.frontend.result }}" \
            "actionlint:${{ needs.actionlint.result }}" \
            "zizmor:${{ needs.zizmor.result }}"
          do
            name="${r%%:*}"
            result="${r##*:}"
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *) echo "$name: $result (FAIL)"; fail=1 ;;
            esac
          done
          exit $fail
