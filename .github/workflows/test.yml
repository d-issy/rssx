name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tui: ${{ steps.filter.outputs.tui }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            tui:
              - 'src/rssx/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/test.yml'

  tui:
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest

  all-test-passed:
    needs: [changes, tui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test jobs succeeded or were skipped
        run: |
          fail=0
          for r in \
            "changes:${{ needs.changes.result }}" \
            "tui:${{ needs.tui.result }}"
          do
            name="${r%%:*}"
            result="${r##*:}"
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *) echo "$name: $result (FAIL)"; fail=1 ;;
            esac
          done
          exit $fail
