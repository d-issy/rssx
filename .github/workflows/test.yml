name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Justfile'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/test.yml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-go-test-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-go-test-${{ runner.os }}-
      - name: Test Go
        run: nix develop --command just test

  all-test-passed:
    needs: [changes, go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test jobs succeeded or were skipped
        run: |
          fail=0
          for r in \
            "changes:${{ needs.changes.result }}" \
            "go:${{ needs.go.result }}"
          do
            name="${r%%:*}"
            result="${r##*:}"
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *) echo "$name: $result (FAIL)"; fail=1 ;;
            esac
          done
          exit $fail
