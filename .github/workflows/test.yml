name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tui: ${{ steps.filter.outputs.tui }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            tui:
              - 'src/rssx/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/test.yml'

  tui:
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest

  all-test-passed:
    needs: [changes, tui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test jobs succeeded or were skipped
        run: |
          fail=0
          for r in \
            "changes:${{ needs.changes.result }}" \
            "tui:${{ needs.tui.result }}"
          do
            name="${r%%:*}"
            result="${r##*:}"
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *) echo "$name: $result (FAIL)"; fail=1 ;;
            esac
          done
          exit $fail
