[project]
name = "rssx"
version = "0.1.0"
description = "Self-hosted minimal RSS reader"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "feedparser>=6.0.11",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
rssx = "rssx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rssx"]
