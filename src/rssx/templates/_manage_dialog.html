<header class="manage-dialog-titlebar">
  <h2 class="manage-dialog-title">管理</h2>
  <button type="button" class="manage-dialog-close" aria-label="閉じる">×</button>
</header>

<div class="manage-dialog-tabbar">
  <div class="manage-tabs" role="tablist">
    <button type="button" class="manage-tab active" data-tab="feeds" role="tab" aria-selected="true">フィード</button>
    <button type="button" class="manage-tab" data-tab="folders" role="tab" aria-selected="false">フォルダ</button>
  </div>
</div>

<section class="manage-tab-panel" data-panel="feeds">
  <div class="manage-toolbar">
    <input
      id="manage-search-input"
      type="search"
      class="manage-search"
      name="q"
      placeholder="タイトル・URL で検索"
      hx-get="/manage/feeds"
      hx-trigger="keyup changed delay:300ms, search"
      hx-target="#manage-feed-list"
      hx-include="[data-folder-filter] [name='folders']"
      autocomplete="off">
    <div class="manage-folder-filter" data-folder-filter>
      <button type="button" class="manage-folder-filter-button" aria-haspopup="listbox" aria-expanded="false">
        <span class="manage-folder-filter-label">フォルダ: すべて</span>
        <span class="manage-folder-filter-caret" aria-hidden="true">▾</span>
      </button>
      <div class="manage-folder-filter-popover" hidden>
        <div class="manage-folder-filter-actions">
          <button type="button" class="manage-folder-filter-action" data-folder-select-all>すべて選択</button>
          <button type="button" class="manage-folder-filter-action" data-folder-select-none>すべて解除</button>
        </div>
        <div class="manage-folder-filter-item" data-folder-row>
          <input type="checkbox" name="folders" value="__orphan" checked
            hx-get="/manage/feeds"
            hx-trigger="change"
            hx-target="#manage-feed-list"
            hx-include="#manage-search-input, [data-folder-filter] [name='folders']">
          <span class="manage-folder-filter-name">未分類</span>
        </div>
        {% for f in folders %}
        <div class="manage-folder-filter-item" data-folder-row>
          <input type="checkbox" name="folders" value="{{ f.id }}" checked
            hx-get="/manage/feeds"
            hx-trigger="change"
            hx-target="#manage-feed-list"
            hx-include="#manage-search-input, [data-folder-filter] [name='folders']">
          <span class="manage-folder-filter-name">{{ f.name }}</span>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <div id="manage-feed-list" class="manage-feed-list">
    {% include "_manage_feed_list.html" %}
  </div>
</section>

<section class="manage-tab-panel" data-panel="folders" hidden>
  <div class="manage-toolbar">
    <button type="button" class="manage-folder-add-button" data-folder-add>+ フォルダ追加</button>
  </div>
  <div id="manage-folder-list" class="manage-folder-list">
    {% include "_manage_folder_list.html" %}
  </div>
</section>
