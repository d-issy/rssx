{% if folders %}
<table class="manage-folder-table">
  <thead>
    <tr>
      <th class="col-name">フォルダ名</th>
      <th class="col-count">フィード数</th>
      <th class="col-actions" aria-label="操作"></th>
    </tr>
  </thead>
  <tbody>
    {% for f in folders %}
      {% include "_manage_folder_row.html" %}
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="manage-empty">フォルダがありません。</p>
{% endif %}
